name: Temporary public-method preparation
on:
  push:
    branches: [prepare/public-methods-031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve exact formal graph
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn install --immutable
          caps --strict --ci
          caps verify --toolchain
      - name: Apply reviewed atomic operations
        run: node apply-reviewed.mjs
      - name: Original complete gates and build
        run: |
          set -euo pipefail
          calcit edit format
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          yarn build
          node --test test/runtime.test.mjs
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - name: Inspect existing Azure namespace without service calls
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const log=console.log;let adapter;
          try{console.log=()=>{};adapter=await import('./assets/play-azure.mjs');}finally{console.log=log;}
          const evidence={globalType:typeof globalThis.SpeechSDK,constructorResult:'not called',serviceCalls:0};
          if(evidence.globalType==='undefined'){
            try{adapter.configAzureSpeechApi('synthetic-unused');evidence.constructorResult='unexpected success';}
            catch(error){evidence.constructorResult={name:error.name,message:error.message};}
          }
          writeFileSync('acceptance/azure-namespace.json',JSON.stringify(evidence,null,2));console.log(evidence);
          NODE
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-method-preparation
          path: acceptance/
          if-no-files-found: error
          retention-days: 7
